app = "word-al-server-anzydev"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "3000"
  NODE_ENV = "production"
  DATA_FILE = "/app/.data/word-al.json"
  LOG_LEVEL = "info"
  CLIENT_ORIGIN = "https://word-al.vercel.app"
  PUBLIC_APP_URL = "https://word-al.vercel.app"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    timeout = "5s"
    path = "/health"
